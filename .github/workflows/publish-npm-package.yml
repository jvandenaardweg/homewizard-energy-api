# This workflow runs the tests and then publishes the package to npm when a GitHub release is created.
# Publishing uses npm trusted publishing (OIDC), so no npm token is stored in the repository.
# See: https://docs.npmjs.com/trusted-publishers

name: Publish NPM Package

env:
  TZ: Europe/Amsterdam # For our date tests

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Lets the npm CLI get an OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1. Node 24 bundles npm 11.
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm --version
      - run: npm ci
      # No NODE_AUTH_TOKEN: the npm CLI authenticates with OIDC, and provenance is generated automatically.
      - run: npm publish
